# Streamlit Cloud Secrets Template
# Use this when deploying to Streamlit Cloud:
# 1. Copy this content to your Streamlit Cloud app's "Secrets" section
# 2. Replace placeholder values with your actual API keys
# 3. This file (.streamlit/secrets.example.toml) should be committed to git
# 4. The actual .streamlit/secrets.toml is gitignored and managed by Streamlit Cloud

# REQUIRED: Gemini API Key
# Get from: https://aistudio.google.com/apikey
GOOGLE_API_KEY = "your-gemini-api-key-here"

# OPTIONAL: LangSmith API Key for tracing
# Get from: https://smith.langchain.com/
LANGSMITH_API_KEY = "your-langsmith-api-key-here"
LANGSMITH_PROJECT = "Factory"

# Application Environment
APP_ENV = "production"
LOG_LEVEL = "INFO"

# LLM Configuration
MODEL_NAME = "gemini-1.5-flash"
TEMPERATURE = 0.7
MAX_TOKENS = 2048

# Memory Configuration
MAX_CONVERSATION_LENGTH = 100
CONVERSATION_BUFFER_TYPE = "buffer"

# Agent Configuration
AGENT_MAX_ITERATIONS = 10
AGENT_TIMEOUT = 30.0

# Session & Security
SESSION_TIMEOUT_MINUTES = 30

# Database (for Streamlit Cloud, consider using cloud-hosted DB)
DATABASE_URL = "sqlite:///./data/factory_ops.db"

# API Integration URLs (update to your actual endpoints)
MES_API_URL = "http://mes-internal.factoryops.com/api"
MAINTENANCE_API_URL = "http://maintenance.factoryops.com/api"
INVENTORY_API_URL = "http://inventory.factoryops.com/api"

# Monitoring
ENABLE_LOGGING = true
LOG_FILE = "logs/factoryops.log"

# LangSmith Configuration
LANGSMITH_ENDPOINT = "https://eu.api.smith.langchain.com"
LANGSMITH_BATCH_TIMEOUT_MS = 100
LANGSMITH_TIMEOUT_MS = 10000
LANGSMITH_TRACING_V2 = true
LANGSMITH_TRACING = true
LANGSMITH_CALLBACKS_BACKGROUND = false
